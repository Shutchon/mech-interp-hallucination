# E0 — TransformerLens vs HuggingFace parity gate (plan §3, E0)
hf_id: google/gemma-2-2b
tl_name: gemma-2-2b
dtype: bfloat16
n_prompts: 100
gate:
  mean_kl_below: 1.0e-3     # KL(HF ‖ TransformerLens), final-token logits, fp32
